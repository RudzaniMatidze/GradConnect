{% extends 'master.html' %}
{% load static %}

{% block title %}Create Profile{% endblock %}

{% block content %}
<div class="container">
    <h2>Create Your Profile</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Create Profile</button>
    </form>
</div>
{% endblock %}
